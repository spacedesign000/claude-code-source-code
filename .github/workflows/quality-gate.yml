name: Engineering Readiness

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Readiness, policy and smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run quality unit tests
        run: node --test scripts/readiness.test.mjs scripts/policy-lint.test.mjs

      - name: Validate policy contract
        run: node scripts/policy-lint.mjs --output policy-report.json

      - name: Run strict readiness gate
        run: node scripts/readiness.mjs --strict --output readiness-report.json

      - name: Smoke-test CLI entrypoint
        run: bun run cli --help

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engineering-readiness-${{ github.run_id }}
          path: |
            readiness-report.json
            policy-report.json
          if-no-files-found: ignore
          retention-days: 14
